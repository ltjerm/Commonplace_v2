<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commonplace</title>
  <meta name="description" content="A personal commonplace journal for quotes, thoughts, and ideas.">
  <meta name="theme-color" content="#eef0fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c16" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Commonplace">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

  <div id="app">
    <header class="topbar">
      <h1 id="title">Commonplace</h1>
      <div id="topActions"></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="dock">
    <nav class="tabbar glass" aria-label="Main">
      <span class="tab-indicator" aria-hidden="true"></span>
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v12H8.5A3.5 3.5 0 0 1 5 16.5z M5 16.5A3.5 3.5 0 0 1 8.5 13H19"/></svg><span>Journal</span></a>
      <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span>Search</span></a>
      <a href="#/random" data-tab="random"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="9" cy="9" r="1.3" class="dot"/><circle cx="15" cy="15" r="1.3" class="dot"/><circle cx="15" cy="9" r="1.3" class="dot"/><circle cx="9" cy="15" r="1.3" class="dot"/></svg><span>Pull one</span></a>
      <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg><span>Settings</span></a>
    </nav>
    <a href="#/new" id="fab" class="fab glass" aria-label="New entry">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </a>
  </div>

  <div id="sheetRoot" hidden>
    <div class="scrim"></div>
    <section class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber" aria-hidden="true"></div>
      <div id="sheetBody"></div>
    </section>
  </div>

  <div id="toast" class="glass" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
